# Nginx — projectpemberkasan (frontend statis + API Node.js)
# Letakkan di : /etc/nginx/sites-available/pemberkasan
# Aktifkan    : sudo ln -s /etc/nginx/sites-available/pemberkasan /etc/nginx/sites-enabled/
# Uji         : sudo nginx -t && sudo systemctl reload nginx
# SSL         : sudo certbot --nginx -d domainkamu.com -d www.domainkamu.com
#
# Prasyarat:
#   - hasil `npm run build` disalin ke /var/www/pemberkasan/build
#   - server Node (server/index.js) jalan di 127.0.0.1:4000 lewat systemd
#     (lihat deploy/pemberkasan.service)

server {
    listen 80;
    listen [::]:80;

    server_name domainkamu.com www.domainkamu.com;

    root /var/www/pemberkasan/build;
    index index.html;

    # Batasi ukuran unggahan di sisi Nginx (samakan dengan batas aplikasi 25 MB)
    client_max_body_size 26m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # --- API diteruskan ke proses Node ---
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # unggahan berkas besar butuh waktu
    }

    # --- Aset ber-hash: cache panjang ---
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/pemberkasan.access.log;
    error_log  /var/log/nginx/pemberkasan.error.log;
}
